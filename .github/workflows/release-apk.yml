name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependencias del Proyecto
        run: npm ci

      - name: 6. Generar Proyecto Nativo de Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 7. Generar Keystore de Firma Digital
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias fitnessapp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fitness123 \
            -keypass fitness123 \
            -dname "CN=FitnessApp, OU=Mobile, O=Fitness, L=CDMX, S=CDMX, C=MX"

      - name: 8. Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 9. Firmar APK para Instalación Directa en Android
        run: |
          APK_UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK_UNSIGNED"
          
          # Firmar usando jarsigner con la keystore generada
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass fitness123 \
            "$APK_UNSIGNED" fitnessapp

          # Copiar y nombrar el APK final
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ]; then
            VERSION_TAG="preview"
          fi
          
          OUTPUT_APK="mi-fitness-app-${VERSION_TAG}.apk"
          cp "$APK_UNSIGNED" "$OUTPUT_APK"
          echo "APK Final Listo: $OUTPUT_APK"
          echo "APK_PATH=$OUTPUT_APK" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: 10. Subir APK como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mi-fitness-app-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: 11. Publicar en GitHub Releases (Solo en Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: "Versión ${{ env.VERSION_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
